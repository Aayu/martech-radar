name: Daily Martech Radar

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:

concurrency:
  group: daily-martech-radar
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -r requirements.txt

      - name: Collect due sources and refresh reading files
        run: >-
          python -m radar run
          --max-sources 14
          --max-articles 24
          --max-requests 180
          --max-seconds 540

      - name: Refresh the browser dashboard
        run: |
          mkdir -p docs
          cp outputs/collector/index.html docs/index.html

      - name: Prepare the permanent web dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Save durable state and reading files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/snapshot outputs/collector docs
          if git diff --cached --quiet; then
            echo "No radar changes to save"
          else
            git commit -m "radar: daily collection $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Keep a downloadable copy of today's reading files
        uses: actions/upload-artifact@v4
        with:
          name: martech-radar-${{ github.run_number }}
          path: outputs/collector
          retention-days: 14

  publish-dashboard:
    needs: collect
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the permanent web dashboard
        id: deployment
        uses: actions/deploy-pages@v4

