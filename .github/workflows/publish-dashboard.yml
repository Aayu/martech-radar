name: Publish Martech Radar dashboard

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/publish-dashboard.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish the dashboard
        id: deployment
        uses: actions/deploy-pages@v4
